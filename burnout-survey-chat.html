<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>過勞量表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0F2EB;--surface:#FFF;--ink:#1A221A;--muted:#68706A;--line:#D2D7C9;
  --accent:#2D5F45;--accent-soft:#D2E5DA;--accent-ink:#FFF;
  --usr:#2D5F45;--usr-ink:#FFF;
  --severe:#8F2E1C;--good:#2D5F45;--mid:#8A6520;
}
/* dark mode disabled */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC",sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;
}

/* ── header ── */
.hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;
  padding-top:max(14px,env(safe-area-inset-top));
  background:var(--surface);border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.hdr-left{display:flex;align-items:center;gap:10px;}
.hdr-avatar{
  width:34px;height:34px;border-radius:50%;
  background:var(--accent-soft);display:flex;align-items:center;justify-content:center;
}
.hdr-avatar svg{width:16px;height:16px;stroke:var(--accent);stroke-width:2;fill:none;}
.hdr-name{font-size:14px;font-weight:600;}
.hdr-sub{font-size:11.5px;color:var(--muted);}
.prog-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.prog-label{font-size:11px;color:var(--muted);}
.prog-track{width:72px;height:3px;background:var(--line);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;background:var(--accent);border-radius:99px;width:0%;transition:width 400ms cubic-bezier(.4,0,.2,1);}

/* ── chat ── */
.chat{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:16px 14px max(20px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;
  scroll-behavior:smooth;
}

/* ── 訊息 ── */
.msg-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:6px;}
.msg-row.sys{align-self:flex-start;max-width:85%;}
.msg-row.usr{align-self:flex-end;flex-direction:row-reverse;max-width:78%;}
.avatar{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  background:var(--accent-soft);display:flex;align-items:center;justify-content:center;
}
.avatar svg{width:13px;height:13px;stroke:var(--accent);stroke-width:2;fill:none;}
.bubble{
  padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.6;
}
.sys .bubble{
  background:var(--surface);color:var(--ink);
  border:1px solid var(--line);
  border-bottom-left-radius:4px;
}
.usr .bubble{
  background:var(--usr);color:var(--usr-ink);
  border-bottom-right-radius:4px;
}

/* 打字 */
.typing-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:6px;}
.typing-bubble{
  background:var(--surface);border:1px solid var(--line);
  border-radius:18px;border-bottom-left-radius:4px;
  padding:12px 16px;display:flex;gap:4px;align-items:center;
}
.typing-bubble span{
  width:7px;height:7px;background:var(--muted);border-radius:50%;
  animation:blink 1.1s infinite ease-in-out;
}
.typing-bubble span:nth-child(2){animation-delay:.18s;}
.typing-bubble span:nth-child(3){animation-delay:.36s;}
@keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}

/* ── 選項群（跟在泡泡後） ── */
.opts-block{
  margin:6px 0 10px 36px;
  display:flex;flex-direction:column;gap:7px;
  animation:fadeUp 280ms cubic-bezier(.16,1,.3,1);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.opt-btn{
  font-family:inherit;font-size:14.5px;font-weight:500;
  color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:20px;
  padding:12px 18px;cursor:pointer;text-align:left;
  transition:border-color 120ms,background 120ms,transform 80ms;
  line-height:1.4;
}
.opt-btn:active{transform:scale(.97);}
.opt-btn:hover{border-color:var(--accent);background:var(--accent-soft);}

/* 兩欄 grid 選項 */
.opts-block.g2{display:grid;grid-template-columns:1fr 1fr;}

/* 量表選項（全寬直列） */
.scale-block{
  margin:6px 0 10px 36px;
  display:flex;flex-direction:column;gap:6px;
  animation:fadeUp 280ms cubic-bezier(.16,1,.3,1);
}
.scale-btn{
  font-family:inherit;font-size:14.5px;font-weight:500;
  color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:20px;
  padding:12px 16px;cursor:pointer;text-align:left;
  display:flex;align-items:center;gap:12px;
  transition:border-color 120ms,background 120ms,transform 80ms;
}
.scale-btn:active{transform:scale(.98);}
.scale-btn:hover{border-color:var(--accent);background:var(--accent-soft);}
.scale-num{
  width:24px;height:24px;border-radius:50%;
  background:var(--bg);border:1px solid var(--line);
  font-size:12px;font-weight:600;color:var(--muted);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}

/* 文字輸入列 */
.input-row{
  margin:6px 0 10px 36px;
  display:flex;gap:8px;align-items:center;
  animation:fadeUp 280ms cubic-bezier(.16,1,.3,1);
}
.input-row input{
  flex:1;min-width:0;
  font-family:inherit;font-size:16px;color:var(--ink);
  background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
  padding:11px 14px;outline:none;
  transition:border-color 150ms;
}
.input-row input:focus{border-color:var(--accent);}
.send-btn{
  flex-shrink:0;width:44px;height:44px;
  background:var(--accent);border:none;border-radius:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:opacity 120ms;
}
.send-btn:disabled{opacity:.35;cursor:not-allowed;}
.send-btn svg{width:17px;height:17px;stroke:var(--accent-ink);stroke-width:2.2;fill:none;}
.input-hint{
  margin:2px 0 8px 36px;font-size:12.5px;min-height:18px;
  transition:color .15s;
}

/* 滿意度 */
.rating-block{
  margin:6px 0 10px 36px;
  display:flex;flex-direction:column;gap:6px;
  animation:fadeUp 280ms cubic-bezier(.16,1,.3,1);
}
.rating-row{display:flex;gap:7px;}
.rating-btn{
  flex:1;aspect-ratio:1;
  font-family:inherit;font-size:16px;font-weight:700;
  color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:border-color 120ms,background 120ms,transform 80ms;
}
.rating-btn:active{transform:scale(.95);}
.rating-btn:hover{border-color:var(--accent);background:var(--accent-soft);}
.rating-labels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);}

/* 結果卡 */
.result-wrap{
  display:flex;align-items:flex-end;gap:8px;margin-bottom:6px;
}
.result-card{
  background:var(--surface);border:1px solid var(--line);border-radius:22px;
  border-bottom-left-radius:6px;
  overflow:hidden;flex:1;max-width:85%;
  animation:fadeUp 280ms cubic-bezier(.16,1,.3,1);
}
.score-grid{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);}
.score-cell{padding:16px 12px;text-align:center;}
.score-cell:first-child{border-right:1px solid var(--line);}
.score-lbl{font-size:11px;color:var(--muted);margin-bottom:8px;}
.score-num{font-size:34px;font-weight:700;line-height:1;}
.score-band{display:inline-block;margin-top:8px;font-size:11.5px;border-radius:20px;padding:3px 12px;border:1.5px solid;}
.score-divider{height:1px;background:var(--line);}
.score-desc{padding:12px 16px;font-size:13px;line-height:1.8;border-bottom:1px solid var(--line);}
.score-desc:last-child{border-bottom:none;}

/* 修改按鈕 */
.undo-btn{
  align-self:center;
  display:flex;align-items:center;gap:5px;
  font-family:inherit;font-size:12px;color:var(--muted);
  background:none;border:1px solid var(--line);border-radius:99px;
  padding:5px 12px;cursor:pointer;margin:2px 0 8px;
  transition:background 120ms;
}
.undo-btn svg{width:12px;height:12px;stroke:var(--muted);stroke-width:2;fill:none;}
.undo-btn:hover{background:var(--line);}

/* 單位選擇 */
.unit-cats{
  margin:6px 0 10px 36px;
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  animation:fadeUp 280ms cubic-bezier(.16,1,.3,1);
}
.unit-cat-btn{
  font-family:inherit;font-size:13.5px;font-weight:500;color:var(--ink);
  background:var(--surface);border:1.5px solid var(--line);border-radius:20px;
  padding:14px 14px;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:7px;
  transition:border-color 120ms,background 120ms;
}
.unit-cat-btn:hover{border-color:var(--accent);background:var(--accent-soft);}
.unit-cat-btn svg{width:20px;height:20px;stroke:var(--accent);stroke-width:1.8;fill:none;}
.unit-subs{
  margin:0 0 10px 36px;
  display:flex;flex-direction:column;gap:0;
  animation:fadeUp 280ms cubic-bezier(.16,1,.3,1);
}
.unit-back{
  display:flex;align-items:center;gap:5px;
  font-family:inherit;font-size:13px;color:var(--muted);
  background:none;border:none;cursor:pointer;padding:0 0 8px;
}
.unit-back svg{width:13px;height:13px;stroke:var(--muted);stroke-width:2;fill:none;}
.unit-sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:44vh;overflow-y:auto;padding-bottom:8px;}

/* 分隔文字 */
.divider-text{
  align-self:center;font-size:12px;color:var(--muted);
  background:var(--bg);padding:0 10px;margin:6px 0;
  position:relative;
}
.divider-text::before,.divider-text::after{
  content:'';position:absolute;top:50%;width:40px;height:1px;background:var(--line);
}
.divider-text::before{right:100%;}
.divider-text::after{left:100%;}

/* ── 內嵌輸入泡泡 ── */
.inline-bubble{
  display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);
  border-radius:22px;border-bottom-left-radius:6px;
  max-width:86%;overflow:hidden;
  animation:fadeUp 280ms cubic-bezier(.16,1,.3,1);
}
.inline-bubble-q{
  font-size:15px;line-height:1.6;padding:11px 16px 9px;color:var(--ink);
}
.inline-bubble-sep{height:1px;background:var(--line);}
.inline-bubble-input{
  display:flex;align-items:center;
}
.inline-bubble-input input{
  flex:1;min-width:0;
  font-family:inherit;font-size:15px;color:var(--ink);
  background:transparent;border:none;outline:none;
  padding:11px 14px;
}
.inline-bubble-input input::placeholder{color:var(--muted);}
.inline-send{
  width:44px;height:44px;margin:4px 8px 4px 0;
  background:var(--accent);border:none;border-radius:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;min-width:44px;
  transition:opacity 120ms,transform 80ms;
}
.inline-send:disabled{opacity:.3;cursor:not-allowed;}
.inline-send:not(:disabled):active{transform:scale(.93);}
.inline-send svg{width:18px;height:18px;stroke:var(--accent-ink);stroke-width:2.5;fill:none;}
.inline-hint{
  font-size:12px;padding:0 16px 9px;min-height:20px;
  transition:color .15s;
}
</style>
</head>

/* ── 進度（排除 divider）── */
function updateProg(){
  var answered=Object.keys(ans).length;
  var pct=Math.round((answered/totalQ)*100);
  progFill.style.width=pct+'%';
  progLabel.textContent=answered>0?(answered+' / '+totalQ):'';
}

function scrollBottom(){chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'});}

/* ── 系統泡泡 ── */
function safeTimeout(fn,ms){var t=setTimeout(fn,ms);timers.push(t);return t;}
function clearAllTimers(){timers.forEach(function(t){clearTimeout(t);});timers=[];}

/* ── 使用者泡泡 ── */

/* ── 分隔提示 ── */

  safeTimeout(function(){

    chat.appendChild(d);scrollBottom();

/* ── 返回修改 ── */
function goBackTo(targetId){
  var targetIdx=STEPS.findIndex(function(s){return s.id===targetId;});
  if(targetIdx<0)return;

  clearAllTimers();

  // 清掉 targetIdx 之後所有 DOM 元素
  var toRemove=[];
  chat.querySelectorAll('[data-step]').forEach(function(el){
    var id=el.getAttribute('data-step');
    var idx=STEPS.findIndex(function(s){return s.id===id;});
    if(idx>=targetIdx)toRemove.push(el);
  });
  toRemove.forEach(function(el){el.remove();});
  chat.querySelectorAll('.undo-btn,.opts-block,.scale-block,.input-row,.input-hint,.rating-block,.unit-cats,.unit-subs,.result-card,.result-wrap,.divider-text,.typing-row,.inline-bubble').forEach(function(el){el.remove();});

  // 清掉答案
  for(var i=targetIdx;i<STEPS.length;i++){
    delete ans[STEPS[i].id];
    delete ansVal[STEPS[i].id];
  }
  stepIndex=targetIdx;
  unitCat=null;
  updateProg();
  safeTimeout(function(){askStep(targetIdx);},200);
}

/* ── 問一題 ── */
function askStep(si){
  if(si>=STEPS.length){showResult();return;}
  var step=STEPS[si];
  stepIndex=si;

  if(step.type==='divider'){
    dividerText(step.text,function(){
      stepIndex=si+1;
      askStep(si+1);
    });
    return;
  }

  // 問句帶入名字（第 4 題之後）
  var q=step.q;
  if(NAME && si>3 && step.type==='scale'){
    // 不每題都帶，偶爾帶，讓對話自然
  }

  if(step.type==='text'||step.type==='birthday'){
    inlineBubble(step,si);
  } else {
    sysBubble(q, 440, function(){
      renderInput(step,si);
    }, step.id);
  }
}

/* ── 渲染輸入 ── */

        send.disabled=true;hint.style.color='var(--severe)';hint.textContent='請輸入您的真實姓名';return;

/* ── 送出答案 ── */
function submitAns(step,si,display,value,rowEl,hintEl){
  if(rowEl)rowEl.remove();

  ans[step.id]=display;
  ansVal[step.id]=value;

  stepIndex=si+1;

  chat.querySelectorAll('.undo-btn').forEach(function(b){b.remove();});

  var ps=Math.round(pKeys.reduce(function(s,k){return s+(ansVal[k]||0);},0)/6);
  var ws=Math.round(wKeys.reduce(function(s,k){return s+(ansVal[k]||0);},0)/7);
  var pb=bandOf(ps,50,70),wb=bandOf(ws,45,60);
  var pbm=bMeta[pb],wbm=bMeta[wb];
  progFill.style.width='100%';
  progLabel.textContent='完成 ✓';

  var greeting=NAME?'謝謝 '+NAME+' 填寫本問卷！':'感謝您填寫本問卷！';
  sysBubble(greeting+'以下是你的評估結果 👇',480,function(){
    // 偵測深色模式取對應色
    var dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
    var pc=dark?pbm.cd:pbm.c, wc=dark?wbm.cd:wbm.c;
    var card=document.createElement('div');card.className='result-card';
    var sg=document.createElement('div');sg.className='score-grid';
    // 個人
    var c1=document.createElement('div');c1.className='score-cell';
    c1.innerHTML='<div class="score-lbl">個人相關過勞</div>';
    var n1=document.createElement('div');n1.className='score-num';n1.style.color=pc;
    n1.textContent=ps;var u1=document.createElement('span');u1.style.cssText='font-size:13px;color:#68706A';u1.textContent=' 分';n1.appendChild(u1);
    var b1=document.createElement('div');b1.className='score-band';b1.style.color=pc;b1.style.borderColor=pc;b1.textContent=pbm.l;
    c1.appendChild(n1);c1.appendChild(b1);
    // 工作
    var c2=document.createElement('div');c2.className='score-cell';
    c2.innerHTML='<div class="score-lbl">工作相關過勞</div>';
    var n2=document.createElement('div');n2.className='score-num';n2.style.color=wc;
    n2.textContent=ws;var u2=document.createElement('span');u2.style.cssText='font-size:13px;color:#68706A';u2.textContent=' 分';n2.appendChild(u2);
    var b2=document.createElement('div');b2.className='score-band';b2.style.color=wc;b2.style.borderColor=wc;b2.textContent=wbm.l;
    c2.appendChild(n2);c2.appendChild(b2);
    sg.appendChild(c1);sg.appendChild(c2);
    var div=document.createElement('div');div.className='score-divider';
    var d1=document.createElement('div');d1.className='score-desc';d1.textContent=pDesc[pb];
    var d2=document.createElement('div');d2.className='score-desc';d2.textContent=wDesc[wb];
    card.appendChild(sg);card.appendChild(div);card.appendChild(d1);card.appendChild(d2);
    // 用 result-wrap 包 avatar + card，跟系統泡泡排版一致
    var rw=document.createElement('div');rw.className='result-wrap';
    var rav=document.createElement('div');rav.className='avatar';
    rav.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M9 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2h-3"/><path d="M9 12h6"/><path d="M9 16h4"/><path d="M9 8h6"/></svg>';
    rw.appendChild(rav);rw.appendChild(card);
    chat.appendChild(rw);scrollBottom();

    safeTimeout(function(){
      sysBubble('若您想重新填寫，請點選下方按鈕。',480,function(){
        var rb=document.createElement('div');rb.className='opts-block';
        var btn=document.createElement('button');btn.className='opt-btn';btn.textContent='重新填寫';
        btn.style.textAlign='center';
        btn.addEventListener('click',function(){
          clearAllTimers();
          ans={};ansVal={};stepIndex=0;NAME='';unitCat=null;
          chat.innerHTML='';updateProg();
          safeTimeout(function(){
            sysBubble('您好！我是過勞評估小幫手，接下來會請您回答幾個問題，大約 3 分鐘即可完成。',500,function(){
              safeTimeout(function(){askStep(0);},200);
            });
          },80);
        });
        rb.appendChild(btn);chat.appendChild(rb);scrollBottom();
      });
    },600);
  });
}

/* ── 啟動 ── */
updateProg();
sysBubble('您好！我是過勞評估小幫手，接下來會請您回答幾個問題，大約 3 分鐘即可完成。',500,function(){
  safeTimeout(function(){askStep(0);},200);
});

})();
</script>
